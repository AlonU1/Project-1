<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>פיקוח אתר — פרויקטים, ליקויים ומשימות</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --navy:#1b2a4a; --navy-d:#13203a; --blue:#2d6cdf; --accent:#e67e22;
  --bg:#f4f6fb; --card:#ffffff; --text:#1d2433; --muted:#6b7488;
  --border:#e3e7f0; --radius:14px; --shadow:0 2px 12px rgba(20,30,60,.08);
  --open:#e74c3c; --prog:#f39c12; --recheck:#9b59b6; --done:#27ae60;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px;line-height:1.5;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--navy),var(--navy-d));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.h-top h1{font-size:1.12rem;font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.h-top h1 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{background:var(--accent);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:1rem;flex:0 0 auto}
.back{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:1.2rem;cursor:pointer;flex:0 0 auto}
.h-btns{display:flex;gap:7px;flex:0 0 auto}
.btn-h{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 11px;border-radius:9px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-h:active{background:rgba(255,255,255,.28)}
.sub{font-size:.74rem;opacity:.8;margin-top:3px}
.banner{background:#fff3cd;color:#7a5c00;font-size:.78rem;padding:8px 16px;text-align:center;display:none}
.banner a{color:var(--blue);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:1.25rem;line-height:1.1}
.stat span{font-size:.62rem;opacity:.85}
.filters{padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px}
.f-row{display:flex;gap:8px}
.search{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;font-size:.95rem;background:var(--card)}
#typeFilter{flex:0 0 auto;width:auto}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:20px;border:1px solid var(--border);background:var(--card);font-size:.82rem;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.list{padding:8px 16px}
.pcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pcard h3{font-size:1.08rem;margin-bottom:3px}
.pcard .addr{font-size:.8rem;color:var(--muted)}
.pcard .mini{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.pill{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:20px}
.pill-open{background:#fdecea;color:var(--open)}
.pill-done{background:#eafaf1;color:var(--done)}
.pill-tot{background:var(--bg);color:var(--muted)}
.chev{color:var(--muted);font-size:1.6rem;flex:0 0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:11px;border-right:5px solid var(--border);cursor:pointer}
.card.s-open{border-right-color:var(--open)}.card.s-prog{border-right-color:var(--prog)}
.card.s-recheck{border-right-color:var(--recheck)}.card.s-done{border-right-color:var(--done);opacity:.74}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c-loc{font-size:.78rem;color:var(--muted);font-weight:600}
.c-title{font-weight:700;font-size:1rem;margin:3px 0 8px}
.badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:.7rem;font-weight:700;white-space:nowrap}
.b-status{color:#fff}.st-open{background:var(--open)}.st-prog{background:var(--prog)}.st-recheck{background:var(--recheck)}.st-done{background:var(--done)}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:.72rem;background:var(--bg);color:var(--muted);padding:3px 9px;border-radius:7px;font-weight:600}
.tag-type{background:#eef2fb;color:var(--navy)}
.tag.sev-גבוהה,.tag.sev-קריטית{background:#fdecea;color:#c0392b}
.tag.sev-בינונית{background:#fef5e7;color:#b9770e}
.tag.gps{background:#eaf3ff;color:var(--blue)}
.tag.fixed{background:#eafaf1;color:var(--done)}
.thumbs{display:flex;gap:6px;flex:0 0 auto}
.c-thumb{width:46px;height:46px;border-radius:9px;object-fit:cover;position:relative}
.c-thumb.after{outline:2px solid var(--done);outline-offset:-2px}
.c-overdue{color:var(--open);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty .big{font-size:3rem;margin-bottom:10px}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:30px;padding:15px 26px;font-size:1rem;font-weight:700;box-shadow:0 6px 20px rgba(230,126,34,.45);cursor:pointer;z-index:25;display:flex;align-items:center;gap:8px}
.fab:active{transform:translateX(-50%) scale(.96)}
.overlay{position:fixed;inset:0;background:rgba(15,22,40,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{position:sticky;top:0;background:var(--navy);color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-radius:20px 20px 0 0;z-index:2}
.sheet-head h2{font-size:1.05rem}
.x{background:none;border:none;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1}
.form{padding:16px 18px 24px}
.field{margin-bottom:15px}
.field label{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font-size:.95rem;background:var(--card);font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:58px}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--border);border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;background:var(--card)}
.seg input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy)}
.areas-edit{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.area-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:6px 10px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:6px}
.area-chip button{background:var(--open);color:#fff;border:none;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:.75rem;line-height:1}
.add-row{display:flex;gap:8px}
.add-row input{flex:1}
.add-row button{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:0 16px;font-weight:700;cursor:pointer}
.photo-box{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo-btn{background:var(--card);border:1.5px dashed var(--blue);color:var(--blue);padding:11px 15px;border-radius:11px;font-weight:600;cursor:pointer;font-size:.88rem}
.photo-prev{position:relative;width:72px;height:72px}
.photo-prev img{width:72px;height:72px;object-fit:cover;border-radius:11px}
.photo-prev .del{position:absolute;top:-7px;left:-7px;background:var(--open);color:#fff;border:none;width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:.9rem;line-height:1}
.gps-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.gps-btn{background:#eaf3ff;border:1px solid #cfe2ff;color:var(--blue);padding:9px 13px;border-radius:11px;font-weight:600;cursor:pointer;font-size:.85rem}
.gps-info{font-size:.78rem;color:var(--muted);width:100%}
.gps-info a{color:var(--blue);font-weight:700;text-decoration:none}
.form-actions{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:14px;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer}
.btn-save{background:var(--accent);color:#fff}
.btn-del{background:#fdecea;color:var(--open);flex:0 0 auto;padding:14px 18px}
.hint{font-size:.72rem;color:var(--muted);margin-top:5px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
@media(min-width:560px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
</style>
</head>
<body>
<header>
  <div class="h-top">
    <div style="display:flex;align-items:center;gap:9px;min-width:0">
      <button class="back" id="backBtn" onclick="goHome()" style="display:none">‹</button>
      <span class="logo">🏗️</span>
      <h1><span class="t" id="hTitle">פיקוח אתר</span></h1>
    </div>
    <div class="h-btns" id="hBtns"></div>
  </div>
  <div class="sub" id="hSub"></div>
  <div class="stats" id="stats" style="display:none"></div>
</header>
<div class="banner" id="secBanner">⚠️ ה-GPS פעיל רק כשהאתר מוגש ב-HTTPS. <a href="#" onclick="alert('העלה את התיקייה ל-GitHub Pages או לכל שרת HTTPS, או הזן מיקום ידנית.');return false">פרטים</a></div>

<div class="filters" id="filters" style="display:none">
  <div class="f-row">
    <input class="search" id="search" placeholder="🔍 חיפוש…" oninput="render()">
    <select class="search" id="typeFilter" onchange="render()"></select>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="list" id="list"></div>

<button class="fab" id="fab" onclick="fabAction()">＋</button>
<div class="toast" id="toast"></div>

<!-- ===== Project modal ===== -->
<div class="overlay" id="projOverlay">
  <div class="sheet">
    <div class="sheet-head"><h2 id="projTitle">פרויקט חדש</h2><button class="x" onclick="closeProj()">×</button></div>
    <form class="form" id="projForm" onsubmit="saveProject(event)">
      <input type="hidden" id="p-id">
      <div class="field"><label>שם הפרויקט *</label><input id="p-name" required placeholder="למשל: מגדל רותם, רחוב הרצל"></div>
      <div class="row2">
        <div class="field"><label>כתובת / מיקום</label><input id="p-addr" placeholder="עיר, רחוב"></div>
        <div class="field"><label>מזמין / יזם</label><input id="p-client" placeholder="שם החברה"></div>
      </div>
      <div class="field">
        <label>אזורים / מבנים / חללים</label>
        <div class="areas-edit" id="p-areas"></div>
        <div class="add-row">
          <input id="p-area-new" placeholder="הוסף אזור (מבנה A, קומה 3, ממ&quot;ד…)" onkeydown="if(event.key==='Enter'){event.preventDefault();addArea()}">
          <button type="button" onclick="addArea()">הוסף</button>
        </div>
        <div class="hint">תגדיר פעם אחת — ותבחר מהרשימה בכל רשומה.</div>
      </div>
      <div class="field"><label>הערות לפרויקט</label><textarea id="p-notes"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn-del" id="pDelBtn" onclick="deleteProject()" style="display:none">🗑️</button>
        <button type="submit" class="btn btn-save">שמירה</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Item modal ===== -->
<div class="overlay" id="defOverlay">
  <div class="sheet">
    <div class="sheet-head"><h2 id="defTitle">רשומה חדשה</h2><button class="x" onclick="closeDef()">×</button></div>
    <form class="form" id="defForm" onsubmit="saveDefect(event)">
      <input type="hidden" id="d-id">
      <div class="field"><label>סוג הרשומה</label><div class="seg" id="seg-type"></div></div>
      <div class="field"><label>תיאור *</label><textarea id="d-desc" required placeholder="סדק בקיר, התקנת מעקה, אישור יציקה…"></textarea></div>
      <div class="row2">
        <div class="field"><label>אזור / מבנה / חלל</label>
          <input id="d-area" list="d-areas" placeholder="בחר או הקלד">
          <datalist id="d-areas"></datalist>
        </div>
        <div class="field"><label>מיקום מדויק</label><input id="d-loc" placeholder="דירה 12 / ציר B"></div>
      </div>
      <div class="row2">
        <div class="field"><label>קטגוריה מקצועית</label><select id="d-cat"></select></div>
        <div class="field"><label>קבלן / אחראי</label><input id="d-contractor" list="contractors" placeholder="שם הקבלן"><datalist id="contractors"></datalist></div>
      </div>
      <div class="field"><label>חומרה / עדיפות</label><div class="seg" id="seg-sev"></div></div>
      <div class="field"><label>סטטוס</label><div class="seg" id="seg-status"></div></div>
      <div class="field"><label>תאריך יעד</label><input type="date" id="d-due"></div>
      <div class="field">
        <label>תמונה — לפני / תיעוד</label>
        <div class="photo-box">
          <label class="photo-btn">📷 צלם / העלה<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(this,'before')"></label>
          <div id="prev-before"></div>
        </div>
      </div>
      <div class="field">
        <label>תמונה — אחרי / לאחר תיקון</label>
        <div class="photo-box">
          <label class="photo-btn">📷 צלם / העלה<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addPhoto(this,'after')"></label>
          <div id="prev-after"></div>
        </div>
      </div>
      <div class="field">
        <label>מיקום GPS</label>
        <div class="gps-box">
          <button type="button" class="gps-btn" onclick="grabGPS(true)">📍 תפוס מיקום</button>
          <button type="button" class="gps-btn" onclick="manualGPS()">✏️ ידני</button>
          <span class="gps-info" id="gps-info">אין מיקום עדיין</span>
        </div>
        <div class="hint">המיקום נתפס מ-GPS המכשיר בזמן התיעוד (נדרש HTTPS + הרשאת מיקום).</div>
      </div>
      <div class="field"><label>הערות נוספות</label><textarea id="d-notes" placeholder="תיעוד טיפול, מי תיקן…"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn-del" id="dDelBtn" onclick="deleteDefect()" style="display:none">🗑️</button>
        <button type="submit" class="btn btn-save">שמירה</button>
      </div>
    </form>
  </div>
</div>

<script src="vendor/exceljs.min.js"></script>
<script>
const CATS=['חשמל','אינסטלציה','גמר/צבע','שלד ובטון','אלומיניום','ריצוף וחיפוי','איטום ורטיבות','גבס','בטיחות','אחר'];
const SEVS=['נמוכה','בינונית','גבוהה','קריטית'];
const STATUSES=[
  {key:'open',label:'פתוח',cls:'open'},
  {key:'prog',label:'בטיפול',cls:'prog'},
  {key:'recheck',label:'לתיקון חוזר',cls:'recheck'},
  {key:'done',label:'סגור',cls:'done'},
];
const TYPES=[
  {key:'defect',label:'ליקוי',icon:'⚠️'},
  {key:'task',label:'משימת ביצוע',icon:'🛠️'},
  {key:'approval',label:'אישור/בדיקה',icon:'✅'},
  {key:'note',label:'הערה',icon:'📝'},
];
const KEY='inspection_store_v2';
let store=loadStore();
let view='projects',curProjectId=null,filter='all';
let curBefore=null,curAfter=null,curGPS=null,editAreas=[];

function loadStore(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!s||!s.projects){
    s={projects:[],defects:[]};
    try{ // migrate v1 flat list
      const old=JSON.parse(localStorage.getItem('inspection_defects_v1'));
      if(old&&old.length){
        const p={id:uid(),name:'פרויקט ראשון',address:'',client:'',notes:'',areas:[],createdAt:Date.now()};
        s.projects.push(p);
        old.forEach(d=>{d.projectId=p.id;d.area=d.location||'';s.defects.push(d);});
      }
    }catch(e){}
  }
  // normalize records (single photo -> before, default type)
  (s.defects||[]).forEach(d=>{
    if(d.photo&&!d.photoBefore){d.photoBefore=d.photo;delete d.photo;}
    if(!d.type)d.type='defect';
  });
  return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true;}catch(e){toast('האחסון מלא — מחק רשומות ישנות או ייצא לאקסל');return false;}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function statusOf(k){return STATUSES.find(s=>s.key===k)||STATUSES[0];}
function typeOf(k){return TYPES.find(t=>t.key===k)||TYPES[0];}
function esc(s){return(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function curProject(){return store.projects.find(p=>p.id===curProjectId);}
function defectsOf(pid){return store.defects.filter(d=>d.projectId===pid);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}

function initForm(){
  document.getElementById('d-cat').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('seg-sev').innerHTML=SEVS.map((s,i)=>`<label><input type="radio" name="sev" value="${s}" ${i===1?'checked':''}><span>${s}</span></label>`).join('');
  document.getElementById('seg-status').innerHTML=STATUSES.map((s,i)=>`<label><input type="radio" name="status" value="${s.key}" ${i===0?'checked':''}><span>${s.label}</span></label>`).join('');
  document.getElementById('seg-type').innerHTML=TYPES.map((t,i)=>`<label><input type="radio" name="rtype" value="${t.key}" ${i===0?'checked':''}><span>${t.icon} ${t.label}</span></label>`).join('');
  document.getElementById('typeFilter').innerHTML='<option value="all">כל הסוגים</option>'+TYPES.map(t=>`<option value="${t.key}">${t.icon} ${t.label}</option>`).join('');
  if(!window.isSecureContext)document.getElementById('secBanner').style.display='block';
}

/* ===== routing ===== */
function goHome(){view='projects';curProjectId=null;filter='all';render();scrollTo(0,0);}
function openProject(id){view='project';curProjectId=id;filter='all';document.getElementById('search').value='';document.getElementById('typeFilter').value='all';render();scrollTo(0,0);}
function render(){view==='projects'?renderProjects():renderProject();}

function renderProjects(){
  document.getElementById('backBtn').style.display='none';
  document.getElementById('hTitle').textContent='הפרויקטים שלי';
  document.getElementById('hSub').textContent=store.projects.length?`${store.projects.length} פרויקטים`:'';
  document.getElementById('hBtns').innerHTML=`<button class="btn-h" onclick="backupData()">💾 גיבוי</button><button class="btn-h" onclick="document.getElementById('importFile').click()">📂 שחזור</button>`;
  document.getElementById('stats').style.display='none';
  document.getElementById('filters').style.display='none';
  document.getElementById('fab').innerHTML='＋ פרויקט חדש';
  const list=document.getElementById('list');
  if(!store.projects.length){list.innerHTML=`<div class="empty"><div class="big">🏢</div>אין עדיין פרויקטים.<br>לחץ «פרויקט חדש» כדי להתחיל.</div>`;return;}
  list.innerHTML=store.projects.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>{
    const ds=defectsOf(p.id),open=ds.filter(d=>d.status!=='done').length,done=ds.filter(d=>d.status==='done').length;
    return `<div class="pcard" onclick="openProject('${p.id}')">
      <div style="min-width:0">
        <h3>${esc(p.name)}</h3>
        <div class="addr">${esc(p.address||'')}${p.client?' · '+esc(p.client):''}</div>
        <div class="mini">
          <span class="pill pill-tot">${ds.length} רשומות</span>
          <span class="pill pill-open">${open} פתוחות</span>
          <span class="pill pill-done">${done} נסגרו</span>
          ${p.areas&&p.areas.length?`<span class="pill pill-tot">${p.areas.length} אזורים</span>`:''}
        </div>
      </div><div class="chev">‹</div></div>`;
  }).join('');
}

function renderProject(){
  const p=curProject();if(!p){goHome();return;}
  const ds=defectsOf(p.id);
  document.getElementById('backBtn').style.display='block';
  document.getElementById('hTitle').textContent=p.name;
  document.getElementById('hSub').textContent=p.address||'';
  document.getElementById('hBtns').innerHTML=`<button class="btn-h" onclick="openProj('${p.id}')">⚙️ פרויקט</button><button class="btn-h" onclick="exportExcel()">⬇️ אקסל</button>`;
  document.getElementById('fab').innerHTML='＋ רשומה חדשה';

  const counts={all:ds.length};
  STATUSES.forEach(s=>counts[s.key]=ds.filter(d=>d.status===s.key).length);
  const overdue=ds.filter(isOverdue).length;
  const statsEl=document.getElementById('stats');statsEl.style.display='grid';
  statsEl.innerHTML=`
    <div class="stat"><b>${counts.all}</b><span>סה"כ</span></div>
    <div class="stat"><b>${counts.open+counts.prog+counts.recheck}</b><span>פתוחות</span></div>
    <div class="stat"><b>${overdue}</b><span>באיחור</span></div>
    <div class="stat"><b>${counts.done}</b><span>נסגרו</span></div>`;

  document.getElementById('filters').style.display='flex';
  const chipDefs=[{key:'all',label:'הכל'}].concat(STATUSES.map(s=>({key:s.key,label:s.label})));
  document.getElementById('chips').innerHTML=chipDefs.map(c=>`<div class="chip ${filter===c.key?'active':''}" onclick="setFilter('${c.key}')">${c.label} (${counts[c.key]??0})</div>`).join('');

  const q=document.getElementById('search').value.trim().toLowerCase();
  const tf=document.getElementById('typeFilter').value;
  let items=ds.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(filter!=='all')items=items.filter(d=>d.status===filter);
  if(tf!=='all')items=items.filter(d=>(d.type||'defect')===tf);
  if(q)items=items.filter(d=>[d.desc,d.area,d.location,d.contractor,d.category].join(' ').toLowerCase().includes(q));

  const list=document.getElementById('list');
  if(!items.length){list.innerHTML=`<div class="empty"><div class="big">📋</div>${ds.length?'אין רשומות שתואמות לסינון.':'אין עדיין רשומות בפרויקט.<br>לחץ «רשומה חדשה».'}</div>`;refreshDataLists();return;}
  list.innerHTML=items.map(d=>{
    const st=statusOf(d.status),ty=typeOf(d.type),od=isOverdue(d);
    return `<div class="card s-${st.cls}" onclick="openDef('${d.id}')">
      <div class="c-head">
        <div style="flex:1">
          <div class="c-loc">${esc(d.area||'—')}${d.location?' · '+esc(d.location):''}</div>
          <div class="c-title">${esc(d.desc)||'(ללא תיאור)'}</div>
        </div>
        <div class="thumbs">
          ${d.photoBefore?`<img class="c-thumb" src="${d.photoBefore}">`:''}
          ${d.photoAfter?`<img class="c-thumb after" src="${d.photoAfter}">`:''}
        </div>
      </div>
      <div><span class="badge b-status st-${st.cls}">${st.label}</span></div>
      <div class="c-meta">
        <span class="tag tag-type">${ty.icon} ${ty.label}</span>
        <span class="tag">${esc(d.category||'')}</span>
        ${d.type==='defect'?`<span class="tag sev-${d.severity}">חומרה: ${esc(d.severity||'')}</span>`:''}
        ${d.contractor?`<span class="tag">👷 ${esc(d.contractor)}</span>`:''}
        ${d.due?`<span class="tag ${od?'c-overdue':''}">📅 ${formatD(d.due)}${od?' (באיחור)':''}</span>`:''}
        ${d.photoAfter?`<span class="tag fixed">✓ תועד תיקון</span>`:''}
        ${d.gps?`<span class="tag gps">📍 GPS</span>`:''}
      </div></div>`;
  }).join('');
  refreshDataLists();
}

function isOverdue(d){return d.due&&d.status!=='done'&&d.due<todayStr();}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function formatD(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function setFilter(k){filter=k;render();}
function fabAction(){view==='projects'?openProj():openDef();}
function refreshDataLists(){
  const p=curProject();
  if(p)document.getElementById('d-areas').innerHTML=(p.areas||[]).map(a=>`<option value="${esc(a)}">`).join('');
  const cons=[...new Set(store.defects.map(d=>d.contractor).filter(Boolean))];
  document.getElementById('contractors').innerHTML=cons.map(s=>`<option value="${esc(s)}">`).join('');
}

/* ===== project form ===== */
function openProj(id){
  document.getElementById('projForm').reset();
  const p=id?store.projects.find(x=>x.id===id):null;
  document.getElementById('projTitle').textContent=p?'עריכת פרויקט':'פרויקט חדש';
  document.getElementById('pDelBtn').style.display=p?'block':'none';
  document.getElementById('p-id').value=p?p.id:'';
  document.getElementById('p-name').value=p?p.name:'';
  document.getElementById('p-addr').value=p?p.address||'':'';
  document.getElementById('p-client').value=p?p.client||'':'';
  document.getElementById('p-notes').value=p?p.notes||'':'';
  editAreas=p?(p.areas||[]).slice():[];renderAreas();
  showOverlay('projOverlay');
}
function renderAreas(){
  document.getElementById('p-areas').innerHTML=editAreas.length?editAreas.map((a,i)=>`<span class="area-chip">${esc(a)}<button type="button" onclick="removeArea(${i})">×</button></span>`).join(''):'<span class="hint">לא הוגדרו אזורים עדיין.</span>';
}
function addArea(){const inp=document.getElementById('p-area-new'),v=inp.value.trim();if(!v)return;if(!editAreas.includes(v))editAreas.push(v);inp.value='';renderAreas();inp.focus();}
function removeArea(i){editAreas.splice(i,1);renderAreas();}
function saveProject(e){
  e.preventDefault();
  const id=document.getElementById('p-id').value;
  const rec={id:id||uid(),name:document.getElementById('p-name').value.trim(),address:document.getElementById('p-addr').value.trim(),client:document.getElementById('p-client').value.trim(),notes:document.getElementById('p-notes').value.trim(),areas:editAreas.slice()};
  if(id){const i=store.projects.findIndex(x=>x.id===id);rec.createdAt=store.projects[i].createdAt;store.projects[i]=rec;}
  else{rec.createdAt=Date.now();store.projects.push(rec);}
  save();closeProj();
  if(!id)openProject(rec.id);else render();
}
function deleteProject(){
  const id=document.getElementById('p-id').value,n=defectsOf(id).length;
  if(confirm(`למחוק את הפרויקט${n?` ואת ${n} הרשומות שבו`:''}? פעולה בלתי הפיכה.`)){
    store.projects=store.projects.filter(x=>x.id!==id);
    store.defects=store.defects.filter(d=>d.projectId!==id);
    save();closeProj();goHome();
  }
}
function closeProj(){hideOverlay('projOverlay');}

/* ===== item form ===== */
function openDef(id){
  const f=document.getElementById('defForm');f.reset();curBefore=null;curAfter=null;curGPS=null;
  showPhoto('before');showPhoto('after');refreshDataLists();
  const d=id?store.defects.find(x=>x.id===id):null;
  document.getElementById('defTitle').textContent=d?'עריכת רשומה':'רשומה חדשה';
  document.getElementById('dDelBtn').style.display=d?'block':'none';
  document.getElementById('d-id').value=d?d.id:'';
  if(d){
    document.getElementById('d-desc').value=d.desc||'';
    document.getElementById('d-area').value=d.area||'';
    document.getElementById('d-loc').value=d.location||'';
    document.getElementById('d-cat').value=d.category||CATS[0];
    document.getElementById('d-contractor').value=d.contractor||'';
    document.getElementById('d-due').value=d.due||'';
    document.getElementById('d-notes').value=d.notes||'';
    setRadio('rtype',d.type||'defect');setRadio('sev',d.severity||'בינונית');setRadio('status',d.status||'open');
    if(d.photoBefore){curBefore=d.photoBefore;showPhoto('before');}
    if(d.photoAfter){curAfter=d.photoAfter;showPhoto('after');}
    if(d.gps){curGPS=d.gps;}
  }else{setRadio('rtype','defect');setRadio('sev','בינונית');setRadio('status','open');}
  showGPS();
  showOverlay('defOverlay');
}
function setRadio(n,v){const el=document.querySelector(`input[name="${n}"][value="${v}"]`);if(el)el.checked=true;}
function getRadio(n){const el=document.querySelector(`input[name="${n}"]:checked`);return el?el.value:'';}
function closeDef(){hideOverlay('defOverlay');}
function saveDefect(e){
  e.preventDefault();
  const id=document.getElementById('d-id').value,area=document.getElementById('d-area').value.trim();
  const rec={id:id||uid(),projectId:curProjectId,type:getRadio('rtype'),
    desc:document.getElementById('d-desc').value.trim(),area:area,location:document.getElementById('d-loc').value.trim(),
    category:document.getElementById('d-cat').value,contractor:document.getElementById('d-contractor').value.trim(),
    severity:getRadio('sev'),status:getRadio('status'),due:document.getElementById('d-due').value,
    notes:document.getElementById('d-notes').value.trim(),photoBefore:curBefore,photoAfter:curAfter,gps:curGPS};
  const p=curProject();
  if(area&&p&&!(p.areas||[]).includes(area)){p.areas=p.areas||[];p.areas.push(area);}
  if(id){const i=store.defects.findIndex(x=>x.id===id);rec.createdAt=store.defects[i].createdAt;store.defects[i]=rec;}
  else{rec.createdAt=Date.now();store.defects.push(rec);}
  save();closeDef();render();
}
function deleteDefect(){const id=document.getElementById('d-id').value;if(confirm('למחוק את הרשומה לצמיתות?')){store.defects=store.defects.filter(x=>x.id!==id);save();closeDef();render();}}

/* ===== photos + gps ===== */
function addPhoto(input,which){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=1100;let w=img.width,h=img.height;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      const data=cv.toDataURL('image/jpeg',0.7);
      if(which==='after')curAfter=data;else curBefore=data;
      showPhoto(which);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
  if(which==='before'&&!curGPS)grabGPS(false);
  input.value='';
}
function showPhoto(which){
  const data=which==='after'?curAfter:curBefore;
  document.getElementById('prev-'+which).innerHTML=data?`<div class="photo-prev"><img src="${data}"><button type="button" class="del" onclick="removePhoto('${which}')">×</button></div>`:'';
}
function removePhoto(which){if(which==='after')curAfter=null;else curBefore=null;showPhoto(which);}
function grabGPS(manual){
  const el=document.getElementById('gps-info');
  if(!window.isSecureContext){el.innerHTML='⚠️ נדרש HTTPS לאיתור אוטומטי. השתמש ב«ידני» או העלה ל-GitHub Pages.';if(manual)manualGPS();return;}
  if(!navigator.geolocation){el.textContent='המכשיר לא תומך ב-GPS';return;}
  el.textContent='מאתר מיקום…';
  navigator.geolocation.getCurrentPosition(
    pos=>{curGPS={lat:+pos.coords.latitude.toFixed(6),lng:+pos.coords.longitude.toFixed(6),acc:Math.round(pos.coords.accuracy),ts:Date.now()};showGPS();},
    err=>{const msg=err.code===1?'אין הרשאת מיקום (אשר בהגדרות הדפדפן)':err.code===3?'תם הזמן — נסה שוב בחוץ':'מיקום לא זמין';if(manual||!curGPS)el.innerHTML=`⚠️ ${msg}. <a href="#" onclick="manualGPS();return false">הזן ידנית</a>`;},
    {enableHighAccuracy:true,timeout:12000,maximumAge:0}
  );
}
function manualGPS(){
  const v=prompt('הדבק קואורדינטות (קו רוחב, קו אורך):\nאפשר להעתיק מ-Google Maps','');
  if(!v)return;
  const m=v.split(/[, ]+/).map(parseFloat);
  if(isFinite(m[0])&&isFinite(m[1])){curGPS={lat:+m[0].toFixed(6),lng:+m[1].toFixed(6),acc:0,ts:Date.now(),manual:true};showGPS();}
  else toast('פורמט לא תקין — נסה: 32.084, 34.887');
}
function showGPS(){
  const el=document.getElementById('gps-info');
  if(curGPS)el.innerHTML=`📍 ${curGPS.lat}, ${curGPS.lng}${curGPS.acc?` (±${curGPS.acc} מ׳)`:' (ידני)'} · <a href="https://maps.google.com/?q=${curGPS.lat},${curGPS.lng}" target="_blank">מפה</a> · <a href="#" onclick="removeGPS();return false">הסר</a>`;
  else el.textContent='אין מיקום עדיין';
}
function removeGPS(){curGPS=null;showGPS();}

/* ===== backup / restore ===== */
function backupData(){
  const blob=new Blob([JSON.stringify(store)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`גיבוי_פיקוח_${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  toast('גיבוי נשמר');
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!data.projects||!data.defects)throw 0;
      if(confirm(`לשחזר ${data.projects.length} פרויקטים ו-${data.defects.length} רשומות? הנתונים הנוכחיים יוחלפו.`)){
        store=data;(store.defects||[]).forEach(d=>{if(!d.type)d.type='defect';});save();goHome();toast('שוחזר בהצלחה');
      }
    }catch(e){toast('קובץ גיבוי לא תקין');}
    input.value='';
  };
  reader.readAsText(file);
}

/* ===== overlay helpers ===== */
function showOverlay(id){document.getElementById(id).classList.add('show');document.body.style.overflow='hidden';}
function hideOverlay(id){document.getElementById(id).classList.remove('show');document.body.style.overflow='';}
['projOverlay','defOverlay'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)hideOverlay(id);}));

/* ===== excel export (with before/after images) ===== */
async function exportExcel(){
  const p=curProject();if(!p)return;
  const ds=defectsOf(p.id);
  if(!ds.length){toast('אין רשומות לייצוא');return;}
  if(typeof ExcelJS==='undefined'){toast('ספריית האקסל לא נטענה');return;}
  toast('מכין קובץ אקסל…');
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('רשומות',{views:[{rightToLeft:true}]});
  const headers=['מס׳','סוג','אזור/מבנה','מיקום','תיאור','קטגוריה','חומרה','קבלן/אחראי','סטטוס','תאריך יעד','באיחור','תאריך פתיחה','מיקום GPS','מפה','תמונה לפני','תמונה אחרי'];
  const NC=headers.length;
  ws.mergeCells(1,1,1,NC);
  const t=ws.getCell('A1');
  t.value=`דוח פיקוח — ${p.name}${p.address?' · '+p.address:''}   |   הופק: ${formatD(todayStr())}`;
  t.font={bold:true,size:13,color:{argb:'FFFFFFFF'}};t.alignment={horizontal:'right',vertical:'middle'};
  t.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1B2A4A'}};ws.getRow(1).height=26;
  const hr=ws.addRow(headers);
  hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF2D6CDF'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};});
  ws.columns=[{width:5},{width:12},{width:15},{width:13},{width:34},{width:12},{width:9},{width:14},{width:11},{width:11},{width:7},{width:11},{width:19},{width:9},{width:19},{width:19}];

  const sorted=ds.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  sorted.forEach((d,i)=>{
    const r=ws.addRow([i+1,typeOf(d.type).label,d.area||'',d.location||'',d.desc||'',d.category||'',
      d.type==='defect'?(d.severity||''):'',d.contractor||'',statusOf(d.status).label,d.due?formatD(d.due):'',
      isOverdue(d)?'כן':'',d.createdAt?formatD(new Date(d.createdAt).toISOString().slice(0,10)):'',
      d.gps?`${d.gps.lat}, ${d.gps.lng}`:'',d.gps?{text:'פתח במפה',hyperlink:`https://maps.google.com/?q=${d.gps.lat},${d.gps.lng}`}:'','','']);
    r.alignment={vertical:'middle',wrapText:true};
    if(d.gps)r.getCell(14).font={color:{argb:'FF2D6CDF'},underline:true};
    const hasImg=d.photoBefore||d.photoAfter;
    if(hasImg)r.height=92;
    if(d.photoBefore)embedImg(wb,ws,d.photoBefore,r.number-1,14);
    if(d.photoAfter)embedImg(wb,ws,d.photoAfter,r.number-1,15);
  });
  ws.autoFilter={from:{row:2,column:1},to:{row:2,column:NC}};
  ws.views=[{rightToLeft:true,state:'frozen',ySplit:2}];

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`דוח_פיקוח_${p.name}_${todayStr()}.xlsx`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function embedImg(wb,ws,dataURL,rowIdx,col0){
  try{
    const ext=dataURL.indexOf('image/png')>-1?'png':'jpeg';
    const imgId=wb.addImage({base64:dataURL.split(',')[1],extension:ext});
    ws.addImage(imgId,{tl:{col:col0+0.1,row:rowIdx+0.1},ext:{width:118,height:88}});
  }catch(e){}
}

/* hidden import input */
const imp=document.createElement('input');imp.type='file';imp.accept='application/json,.json';imp.id='importFile';imp.style.display='none';imp.onchange=function(){importData(this);};document.body.appendChild(imp);

/* service worker for offline */
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

initForm();render();
</script>
